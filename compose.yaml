services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 40
  init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./database/Create-FormaDrive.sql:/setup/create.sql:ro
    environment:
      SQLCMDPASSWORD: ${DB_ROOT_PASSWORD}
      APP_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        [[ "$$APP_PASSWORD" =~ ^[a-zA-Z0-9]{16,128}$$ ]] || { echo "Use 16-128 letters and digits for DB_PASSWORD"; exit 1; }
        sql=(/opt/mssql-tools18/bin/sqlcmd -S db -U sa -C -b)
        "$${sql[@]}" -i /setup/create.sql
        "$${sql[@]}" <<'SQL'
        IF SUSER_ID(N'forma_web') IS NULL CREATE LOGIN forma_web WITH PASSWORD = '$(APP_PASSWORD)';
        GO
        USE FormaDrive;
        GO
        IF USER_ID(N'forma_web') IS NULL CREATE USER forma_web FOR LOGIN forma_web;
        IF IS_ROLEMEMBER('db_owner','forma_web') <> 1 ALTER ROLE db_owner ADD MEMBER forma_web;
        GO
        SQL
  web:
    build: .
    ports:
      - "127.0.0.1:5187:8080"
    environment:
      ConnectionStrings__Fleet: "Server=db;Database=FormaDrive;User ID=forma_web;Password=${DB_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      Staff__Email: staff@forma.local
      Staff__Password: ${STAFF_PASSWORD:?Set STAFF_PASSWORD in .env}
    depends_on:
      init:
        condition: service_completed_successfully
volumes:
  sqlserver-data:

